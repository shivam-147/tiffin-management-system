services:
  mongodb:
    image: mongo:5
    container_name: tiffin-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiffin-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/tiffin_management
      - JWT_SECRET=tiffin_management_system_secure_jwt_secret_key_32_chars_min
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=tiffin_management_system_secure_refresh_secret_key_32_chars
      - JWT_REFRESH_EXPIRES_IN=7d
      - BUSINESS_NAME=Tiffin Distribution Services
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
